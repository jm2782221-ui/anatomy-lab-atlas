<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Free interactive 3D anatomy atlas: every bone and muscle of the human body, bone markings with definitions and clinical notes, and a pin test for lab practicals.">
<meta name="theme-color" content="#EEF1EC">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2318201C'/%3E%3Cpath d='M22 14a6 6 0 0 0-4 10l16 16a6 6 0 1 0 10 6 6 6 0 1 0-6-10L22 20a6 6 0 0 0 0-6z' fill='%23E6DCC4'/%3E%3C/svg%3E">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Anatomy Lab Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,500;0,600;1,500;1,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: specimen stage (3D) over a lab-notebook panel on phones; stage left + panel right on desktop */
:root{
  --paper:#EEF1EC; --surface:#FFFFFF; --ink:#18201C; --muted:#5A6660; --line:#D2D9D3;
  --stage:#DCE3DE; --stage2:#C7D1CA;
  --accent:#1F5F8B; --accent-ink:#FFFFFF;
  --proj:#C2482B; --dep:#2F6FB8; --other:#8A7428;
  --bone:#E6DCC4; --muscle:#B5443C; --good:#2E7D4F; --bad:#B23A30;
  --f-display:'Spectral',Georgia,'Times New Roman',serif;
  --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#111513; --surface:#1A201D; --ink:#E3EAE5; --muted:#97A49D; --line:#2C3531;
  --stage:#0C110F; --stage2:#1A221E; --accent:#79B0DB; --accent-ink:#0C1A24;
  --proj:#E57E62; --dep:#74A6E6; --other:#CDB86C; --bone:#D9CFB6; --muscle:#CF5C50; --good:#62C08A; --bad:#E86E62;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#111513; --surface:#1A201D; --ink:#E3EAE5; --muted:#97A49D; --line:#2C3531;
  --stage:#0C110F; --stage2:#1A221E; --accent:#79B0DB; --accent-ink:#0C1A24;
  --proj:#E57E62; --dep:#74A6E6; --other:#CDB86C; --bone:#D9CFB6; --muscle:#CF5C50; --good:#62C08A; --bad:#E86E62;
  color-scheme:dark}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;overflow:hidden}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{height:100%;display:grid;grid-template-rows:auto 1fr;min-height:0}
header{padding-block:10px 8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:8px;border-bottom:1px solid var(--line);background:var(--paper);position:relative;z-index:5}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand h1{margin:0;font-family:var(--f-display);font-style:italic;font-weight:600;font-size:22px;letter-spacing:-.01em}
.brand span{font-family:var(--f-mono);font-size:11px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.search{position:relative}
.search input{width:100%;padding:10px 12px 10px 36px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:inherit;font-size:16px}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;fill:none;stroke:var(--muted);stroke-width:2}
.results{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.18);max-height:50vh;overflow:auto;z-index:20}
.results button{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;padding:10px 12px;border:0;border-bottom:1px solid var(--line);background:none}
.results button:last-child{border-bottom:0}
.results small{color:var(--muted);font-family:var(--f-mono);font-size:11px;white-space:nowrap}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-inline:-2px;padding:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;font-size:13px;min-height:36px;transition:background .2s,color .2s,border-color .2s,transform .15s}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
main{display:grid;grid-template-rows:minmax(260px,52%) 1fr;min-height:0}
@media (min-width:900px){main{grid-template-rows:1fr;grid-template-columns:1fr 420px}}
.stage{position:relative;background:radial-gradient(ellipse at 50% 40%,var(--stage2),var(--stage) 70%);min-height:0;overflow:hidden;touch-action:none}
.stage canvas{display:block;width:100%;height:100%}
.tools{position:absolute;display:flex;gap:6px;flex-wrap:wrap}
.tools.left{left:max(10px,env(safe-area-inset-left,0px));bottom:10px}
.tools.right{right:max(10px,env(safe-area-inset-right,0px));top:10px;flex-direction:column;align-items:flex-end}
.tool{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:color-mix(in srgb,var(--surface) 86%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:10px;padding:6px 10px;font-family:var(--f-mono);font-size:11px;letter-spacing:.04em;text-transform:uppercase;min-height:38px;min-width:42px;justify-content:center;box-shadow:0 2px 10px rgba(0,0,0,.06);transition:background .2s,color .2s,border-color .2s,transform .15s}
.tool svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.views{display:flex;gap:2px;padding:3px;border:1px solid var(--line);border-radius:12px;background:color-mix(in srgb,var(--surface) 86%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.views .tool{border:0;background:none;box-shadow:none;min-width:44px}
.views .tool:hover{background:color-mix(in srgb,var(--ink) 8%,transparent)}
.tool[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.label{position:absolute;left:0;top:0;pointer-events:none;transform:translate(-50%,calc(-100% - 10px));background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:3px 7px;font-size:12px;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.label.sel{background:var(--ink);color:var(--paper);border-color:var(--ink);font-weight:500}
.label.mini{font-size:10.5px;padding:2px 5px;transform:translate(-50%,calc(-100% - 6px));opacity:.92}
[hidden]{display:none!important}
.loading{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;z-index:4}
.credit{font-size:12px;color:var(--muted)}
.credit a{color:inherit}
.crumb{position:absolute;top:10px;left:max(10px,env(safe-area-inset-left,0px));max-width:calc(100% - 128px);display:flex;align-items:center;gap:8px;background:color-mix(in srgb,var(--surface) 86%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:12px;padding:5px 10px 5px 5px;box-shadow:0 4px 18px rgba(0,0,0,.08);animation:pop .35s cubic-bezier(.2,.9,.3,1.2)}
.crumb .back{flex:none;width:32px;height:32px;border-radius:9px;border:0;background:var(--ink);color:var(--paper);display:grid;place-items:center;transition:transform .15s}
.crumb .back[hidden]{display:none}
.crumb .back svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.crumb .ct{min-width:0;display:grid;line-height:1.2}
.crumb b{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb small{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb.solo{padding-left:10px}
.toast{position:absolute;left:50%;bottom:58px;transform:translate(-50%,8px);opacity:0;background:var(--ink);color:var(--paper);padding:8px 14px;border-radius:999px;font-size:13px;pointer-events:none;transition:opacity .25s,transform .35s cubic-bezier(.2,.9,.3,1.2);max-width:calc(100% - 32px);text-align:center;z-index:6}
.toast.show{opacity:1;transform:translate(-50%,0)}
.coach{position:absolute;left:50%;bottom:58px;transform:translateX(-50%);width:min(360px,calc(100% - 24px));background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 14px 12px;box-shadow:0 18px 50px rgba(0,0,0,.22);z-index:7;animation:rise .45s cubic-bezier(.2,.9,.3,1.15)}
.coach ol{margin:6px 0 10px;padding-left:20px;display:grid;gap:4px;font-size:14px}
.coach h3{margin:0}
.loadcard{display:grid;gap:10px;justify-items:center;background:color-mix(in srgb,var(--surface) 85%,transparent);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:14px;padding:14px 18px;min-width:200px}
.shimmer{background:linear-gradient(90deg,var(--muted) 0%,var(--ink) 50%,var(--muted) 100%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shim 1.6s linear infinite;font-family:var(--f-mono);font-size:12px}
.bar{width:160px;height:4px;border-radius:4px;background:var(--line);overflow:hidden;position:relative}
.bar i{position:absolute;inset:0;width:40%;border-radius:4px;background:var(--accent);animation:slide 1.2s ease-in-out infinite}
@keyframes shim{to{background-position:-200% 0}}
@keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
@keyframes pop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translate(-50%,16px)}to{opacity:1;transform:translateX(-50%)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(3px)}30%,50%,70%{transform:translateX(-5px)}40%,60%{transform:translateX(5px)}}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.03)}100%{transform:scale(1)}}
.body.enter > *{animation:fadeUp .38s cubic-bezier(.2,.8,.2,1) both}
.body.enter > *:nth-child(2){animation-delay:.03s}.body.enter > *:nth-child(3){animation-delay:.06s}.body.enter > *:nth-child(4){animation-delay:.09s}.body.enter > *:nth-child(5){animation-delay:.12s}.body.enter > *:nth-child(n+6){animation-delay:.15s}
button:active:not(:disabled){transform:scale(.97)}
.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.mode{display:grid;gap:2px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;transition:border-color .2s,box-shadow .2s,transform .15s}
.mode b{font-size:14px}
.mode small{color:var(--muted);font-size:12px}
.mode[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.qprog{height:4px;background:var(--line);border-radius:4px;overflow:hidden}
.qprog i{display:block;height:100%;background:var(--good);transition:width .5s cubic-bezier(.2,.8,.2,1)}
.choice.right{animation:bump .35s}
.choice.wrong{animation:shake .4s}
.choice kbd{float:right;font-family:var(--f-mono);font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:0 5px}
@media (hover:none){.choice kbd{display:none}}
.panel{display:grid;grid-template-rows:auto 1fr;min-height:0;background:var(--paper);border-top:1px solid var(--line)}
@media (min-width:900px){.panel{border-top:0;border-left:1px solid var(--line)}}
.tabwrap{padding-block:8px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line)}
.tabs{position:relative;display:flex;background:color-mix(in srgb,var(--ink) 6%,transparent);border-radius:12px;padding:3px}
.tab{position:relative;z-index:1;flex:1;border:0;background:none;padding:9px 6px;font-size:13.5px;font-weight:500;color:var(--muted);border-radius:9px;transition:color .25s}
.tab[aria-selected="true"]{color:var(--ink)}
.tabind{position:absolute;z-index:0;top:3px;bottom:3px;left:0;border-radius:9px;background:var(--surface);box-shadow:0 1px 6px rgba(0,0,0,.1);transition:transform .45s cubic-bezier(.3,1.3,.4,1),width .45s cubic-bezier(.3,1.3,.4,1)}
.body{overflow:auto;padding-block:14px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));-webkit-overflow-scrolling:touch}
.body > * + *{margin-top:14px}
h2{font-family:var(--f-display);font-weight:600;font-size:24px;line-height:1.15;margin:0;text-wrap:balance}
h2 em{font-weight:500}
h3{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 6px;font-weight:500}
p{margin:0;max-width:65ch}
.muted{color:var(--muted)}
.meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:12px;border:1px solid var(--line);background:var(--surface)}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.t-proj{background:var(--proj)} .t-dep{background:var(--dep)} .t-other{background:var(--other)} .t-mus{background:var(--muscle)}
.field{border-top:1px solid var(--line);padding-top:10px}
.links{display:flex;flex-wrap:wrap;gap:6px}
.link{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;font-size:13px;display:inline-flex;align-items:center;gap:6px;min-height:34px;text-align:left}
.link:hover{border-color:var(--accent)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--paper);border-radius:10px;padding:9px 15px;font-weight:500;min-height:42px;transition:transform .15s,background .2s,box-shadow .2s}
.btn:hover{box-shadow:0 4px 14px rgba(0,0,0,.12)}
.btn.ghost{background:none;color:var(--ink);border-color:var(--line)}
.btn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
textarea{width:100%;min-height:76px;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--ink);padding:9px 10px;font:inherit;font-size:15px;resize:vertical}
.list{display:grid;gap:6px}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;text-align:left;width:100%}
.item small{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.item .grow{min-width:0;flex:1}
.item .note{display:block;color:var(--muted);font-size:13px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:6px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0}
input[type=range]{width:100%;accent-color:var(--accent)}
.score{display:flex;gap:16px;font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.score b{color:var(--ink);font-size:18px;font-weight:500;display:block}
.choices{display:grid;gap:8px}
.choice{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:12px;text-align:left;font-size:15px;min-height:46px}
.choice.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--surface))}
.choice.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--surface))}
.typed{display:flex;gap:8px}
.typed input{flex:1;min-width:0;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--ink);font:inherit;font-size:16px}
.verdict{font-weight:600}
.verdict.ok{color:var(--good)} .verdict.no{color:var(--bad)}
.empty{border:1px dashed var(--line);border-radius:10px;padding:14px;color:var(--muted)}
.latin{font-family:var(--f-display);font-style:italic}
.star{font-size:16px;line-height:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:420px){.tool span.tl{display:none}.tool{padding:6px 9px}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand"><h1>Anatomy Lab Atlas</h1><span>Human · whole body · v1.0</span></div>
    <div class="search">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <input id="q" type="search" placeholder="Search any bone, marking, or muscle" autocomplete="off" aria-label="Search structures">
      <div class="results" id="results" hidden></div>
    </div>
    <div class="chips" id="boneChips" role="toolbar" aria-label="Body regions"></div>
  </header>
  <main>
    <section class="stage" id="stage">
      <div class="crumb" id="crumb"><button class="back" id="back" aria-label="Back" hidden><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button><div class="ct"><b id="crumbT">Whole body</b><small id="crumbS">Drag to rotate · tap a bone to see its markings</small></div></div>
      <div class="toast" id="toast" role="status" aria-live="polite"></div>
      <div id="labels"></div>
      <div class="loading" id="loading"><div class="loadcard"><span class="shimmer" id="loadTxt">Loading skeleton…</span><div class="bar"><i></i></div></div></div>
      <div class="tools left" role="toolbar" aria-label="Camera views">
        <div class="views">
        <button class="tool" data-view="ant" title="Anterior view (front)">Ant</button>
        <button class="tool" data-view="post" title="Posterior view (back)">Post</button>
        <button class="tool" data-view="lat" title="Lateral view (outer side)">Lat</button>
        <button class="tool" data-view="med" title="Medial view (inner side)">Med</button>
        </div>
      </div>
      <div class="tools right" role="toolbar" aria-label="Layers">
        <button class="tool" id="tMus" aria-pressed="false" title="Show or hide the muscle layer"><svg viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 13l9 5 9-5"/></svg><span class="tl">Muscles</span></button>
        <button class="tool" id="tLab" aria-pressed="false" title="Name every marking on the selected bone"><svg viewBox="0 0 24 24"><path d="M20 12l-8 8-9-9V3h8l9 9z"/><circle cx="7.5" cy="7.5" r="1.2"/></svg><span class="tl">Labels</span></button>
        <button class="tool" id="tReset" title="Back to the whole body"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg><span class="tl">Reset</span></button>
      </div>
    </section>
    <section class="panel">
      <div class="tabwrap"><div class="tabs" role="tablist" id="tabs">
        <span class="tabind" id="tabind" aria-hidden="true"></span>
        <button class="tab" role="tab" data-tab="explore" aria-selected="true">Explore</button>
        <button class="tab" role="tab" data-tab="quiz" aria-selected="false">Pin test</button>
        <button class="tab" role="tab" data-tab="prep" aria-selected="false">Exam prep</button>
      </div></div>
      <div class="body" id="body"></div>
    </section>
  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/environments/RoomEnvironment.js"></script>
<script>
/* ---------------- DATA ---------------- */
const BONES = {
  clavicle:{name:'Clavicle', latin:'clavicula', blurb:'S-shaped strut between the sternum and acromion. It holds the limb away from the trunk and is the most frequently fractured bone in the body, usually in its middle third.'},
  scapula:{name:'Scapula', latin:'scapula', blurb:'Flat triangular bone on the posterior thorax. Its fossae give origin to the rotator cuff, and its glenoid cavity forms the socket of the shoulder joint.'},
  humerus:{name:'Humerus', latin:'humerus', blurb:'Long bone of the arm. The proximal end forms the shoulder with the glenoid cavity; the distal end forms the elbow with the radius and ulna.'},
  ulna:{name:'Ulna', latin:'ulna', blurb:'Medial forearm bone. Its proximal end grips the trochlea of the humerus, making it the main stabilizer of the elbow.'},
  radius:{name:'Radius', latin:'radius', blurb:'Lateral forearm bone. It rotates around the ulna during pronation and supination, and its distal end carries most of the load at the wrist.'}
};
const ORDER=['clavicle','scapula','humerus','ulna','radius'];
const TYPE={proj:'Projection',dep:'Depression / opening',other:'Neck, border or line'};

ebral foramen for the spinal nerve.","aka":[]},"c-transforamen":{"n":"Transverse foramen","t":"dep","d":"Hole in each cervical transverse process; only cervical vertebrae have it.","at":"","lig":"","c":"Carries the vertebral artery (C6 to C1) and vertebral veins.","aka":["foramen transversarium"]},"c-bifid":{"n":"Bifid spinous process","t":"proj","d":"Split (two-pronged) tip of the spinous process typical of C2 to C6.","at":"Nuchal ligament and deep neck muscles.","lig":"","c":"","aka":[]},"c7-prom":{"n":"Vertebra prominens spinous process","t":"proj","d":"Long, non-bifid spinous process of C7, the first easily felt bump at the base of the neck.","at":"","lig":"Nuchal ligament attaches here.","c":"Standard landmark for counting vertebrae.","aka":[]},"at-ant":{"n":"Anterior arch of atlas","t":"other","d":"Short front arch of C1 with a facet for the dens on its back surface.","at":"","lig":"","c":"The atlas has no body or spinous process.","aka":[]},"at-post":{"n":"Posterior arch of atlas","t":"other","d":"Longer back arch of C1, grooved on top by the vertebral artery.","at":"","lig":"","c":"Jefferson fracture is a burst fracture of the atlas arches.","aka":[]},"at-supfacet":{"n":"Superior articular facet of atlas","t":"dep","d":"Kidney-shaped concave facet that cradles the occipital condyle.","at":"","lig":"","c":"The atlanto-occipital joint allows nodding (\"yes\" movement).","aka":[]},"at-postubercle":{"n":"Posterior tubercle of atlas","t":"proj","d":"Small bump in place of a spinous process.","at":"Rectus capitis posterior minor.","lig":"","c":"","aka":[]},"ax-dens":{"n":"Dens","t":"proj","d":"Tooth-like peg rising from the body of C2; the atlas pivots around it.","at":"","lig":"Transverse ligament of atlas holds it; alar and apical ligaments.","c":"Dens fractures are common in falls among older adults. The atlanto-axial joint allows head rotation (\"no\").","aka":["odontoid process"]},"t-costal":{"n":"Costal facet","t":"dep","d":"Facet on the side of a thoracic b function showLoad(t){loadTxt.textContent=t;loadEl.hidden=false;}

async function fetchPack(url){
  if(typeof DecompressionStream==='undefined')throw new Error('old');
  const r=await fetch(url);if(!r.ok)throw new Error(r.status);
  const s=atob((await r.text()).trim());const u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);
  return await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer();}
function buildFile(buf,fk){
  PARTS.forEach(p=>{if(p.f!==fk)return;
    const q=new Int16Array(buf,p.p[0],p.p[1]),pos=new Float32Array(q.length);
    for(let i=0;i<q.length;i+=3){pos[i]=(q[i]+32767)*p.sc[0]+p.lo[0];pos[i+1]=(q[i+1]+32767)*p.sc[1]+p.lo[1];pos[i+2]=(q[i+2]+32767)*p.sc[2]+p.lo[2];}
    const g=new THREE.BufferGeometry();
    g.setAttribute('position',new THREE.BufferAttribute(pos,3));
    g.setAttribute('normal',new THREE.BufferAttribute(new Int8Array(buf,p.n[0],p.n[1]),3,true));
    g.setAttribute('cav',new THREE.BufferAttribute(new Uint8Array(buf,p.c[0],p.c[1]),1,true));
    g.setAttribute('tend',new THREE.BufferAttribute(new Uint8Array(buf,p.t[0],p.t[1]),1,true));
    g.setIndex(new THREE.BufferAttribute(p.ix32?new Uint32Array(buf,p.i[0],p.i[1]):new Uint16Array(buf,p.i[0],p.i[1]),1));
    g.computeBoundingSphere();g.computeBoundingBox();
    let m;
    if(p.k==='bone'){m=new THREE.Mesh(g,boneMat);m.castShadow=true;m.receiveShadow=true;}
    else{m=new THREE.Mesh(g,patchMat(new THREE.MeshPhysicalMaterial({color:0xffffff,roughness:.42,metalness:0,clearcoat:.55,clearcoatRoughness:.3,envMapIntensity:.7,transparent:true,opacity:.55,depthWrite:false}),MUS_FRAG,V(p.ax)));
      m.renderOrder=5;m.receiveShadow=true;m.visible=false;}
    m.userData.pid=p.id;m.matrixAutoUpdate=false;scene.add(m);meshes[p.id]=m;});
}
let musP=null,musReady=false;
function ensureMuscles(){
  if(musReady)return Promise.resolve();
  if(musP)return musP;
  showLoad('Loading muscles…');
  musP=Promise.all(['m1','m2'].map(f=>fetchPack(f+'.txt').then(b=>({b,f})))).then(list=>{list.forEach(x=>buildFile(x.b,x.f));musReady=true;hideLoad();applyScene();render();})
    .catch(()=>{musP=null;showLoad('Muscles could not load. Check your connection and tap Muscles again.');setTimeout(hideLoad,3500);});
  return musP;}

function flyTo(target,dist,dir){const t=target.clone();const d=dir?V(dir).normalize():cam.position.clone().sub(controls.target).normalize();
  fly={t0:performance.now(),fromT:controls.target.clone(),fromP:cam.position.clone(),toT:t,toP:t.clone().add(d.multiplyScalar(dist))};}
function boxOfIds(ids){const b=new THREE.Box3();ids.forEach(id=>{const m=meshes[id];if(m){m.geometry.computeBoundingBox();b.union(m.geometry.boundingBox);}});return b;}
function frame(box,dir){if(box.isEmpty())return;const c=box.getCenter(new THREE.Vector3()),s=box.getSize(new THREE.Vector3());
  const th=Math.tan(cam.fov*Math.PI/360);
  const dist=Math.max((s.y/2)/th,(Math.max(s.x,s.z)/2)/(th*cam.aspect))*1.15+Math.max(s.x,s.z)/2;
  flyTo(c,Math.max(dist,1.1),dir);}
const boneIds=r=>PARTS.filter(p=>p.k==='bone'&&(r==='all'||p.rg===r)).map(p=>p.id);

/* ---------------- SCENE STATE ---------------- */
function visiblePinKeys(){const s=new Set();
  if(S.tab==='quiz'){const c=S.quiz.cur;if(c&&c.kind==='mark')s.add(c.pid+'|'+c.id);return s;}
  if(S.iso)(PM[S.iso]||[]).forEach(it=>s.add(S.iso+'|'+it.id));
  return s;}
function hiMuscles(){const h=new Set();const sel=S.sel,q=S.tab==='quiz'?S.quiz.cur:null;
  if(q){if(q.kind==='part'&&PBY[q.id].k==='muscle')h.add(q.id);return h;}
  if(sel&&sel.kind==='mus')PARTS.forEach(p=>{if(p.mk===sel.key&&p.sd===sel.s)h.add(p.id);});
  if(sel&&sel.kind==='part'&&PBY[sel.pid].k==='muscle')h.add(sel.pid);
  return h;}
function applyScene(){
  const q=S.tab==='quiz'?S.quiz.cur:null;const hm=hiMuscles();
  const hiBone=q&&q.kind==='part'&&PBY[q.id].k==='bone'?q.id:null;
  const quizIso=q&&q.kind==='mark'?q.pid:null;
  const iso=S.tab==='quiz'?quizIso:S.iso;
  PARTS.forEach(p=>{const m=meshes[p.id];if(!m)return;
    const inR=S.region==='all'||p.rg===S.region||S.tab==='quiz';
    if(p.k==='bone'){let mat=inR?boneMat:boneGhost;
      if(iso)mat=p.id===iso?boneMat:boneGhost;
      if(hiBone&&p.id===hiBone)mat=boneHi;
      m.material=mat;m.castShadow=mat!==boneGhost;}
    else{const hi=hm.has(p.id);
      const show=q?hi:(hi||(S.muscles&&!S.iso&&inR));
      m.visible=show;if(!show)return;
      const op=hi?.95:(hm.size?S.muscleOpacity*.35:S.muscleOpacity);
      const mt=m.material;mt.opacity=op;mt.depthWrite=op>.85;mt.emissive.set(hi?COL.accent:'#000000');mt.emissiveIntensity=hi?.2:0;}});
  const vis=visiblePinKeys();for(const k in pins)pins[k].visible=vis.has(k);
}

const labelsEl=document.getElementById('labels');let labelPool=[];
function partCenter(ids){return boxOfIds(ids).getCenter(new THREE.Vector3());}
function updateLabels(){
  const want=[];
  if(S.tab!=='quiz'){
    if(S.labels&&S.iso)visiblePinKeys().forEach(k=>{const p=pins[k];const {id,pid}=p.userData;
      if(!(S.sel&&S.sel.kind==='mark'&&S.sel.id===id&&S.sel.pid===pid)&&p.userData.facing!==false)want.push({text:MD[id].n,cls:'label mini',p:p.position});});
    const sel=S.sel;
    if(sel&&sel.kind==='mark')want.push({text:MD[sel.id].n,cls:'label sel',p:instOf(sel.pid,sel.id).pos});
    if(sel&&sel.kind==='mus'){const ids=PARTS.filter(p=>p.mk===sel.key&&p.sd===sel.s).map(p=>p.id);want.push({text:SIDE[sel.s]+' '+MUS[sel.key].n.toLowerCase(),cls:'label sel',p:partCenter(ids)});}
    if(sel&&sel.kind==='part')want.push({text:PBY[sel.pid].nm,cls:'label sel',p:partCenter([sel.pid])});
    if(!sel&&S.iso&&!(PM[S.iso]&&PM[S.iso].length))want.push({text:PBY[S.iso].nm,cls:'label sel',p:partCenter([S.iso])});
  }else if(S.quiz.answered&&S.quiz.cur){const c=S.quiz.cur;
    want.push({text:nameOf(c),cls:'label sel',p:c.kind==='mark'?instOf(c.pid,c.id).pos:partCenter([c.id])});}
  while(labelPool.length<want.length){const d=document.createElement('div');labelsEl.appendChild(d);labelPool.push(d);}
  const w=stage.clientWidth,h=stage.clientHeight;const placed=[];
  want.sort((a,b)=>(b.cls.includes('sel')?1:0)-(a.cls.includes('sel')?1:0));
  labelPool.forEach((d,i)=>{const L=want[i];if(!L){d.hidden=true;return;}
    const v=L.p.clone().project(cam);if(v.z>1){d.hidden=true;return;}
    const sx=(v.x*.5+.5)*w,sy=(-v.y*.5+.5)*h,lw=L.text.length*6.2+12;
    if(!L.cls.includes('sel')&&placed.some(r=>Math.abs(r.x-sx)<(r.w+lw)/2&&Math.abs(r.y-sy)<18)){d.hidden=true;return;}
    placed.push({x:sx,y:sy,w:lw});
    d.hidden=false;d.className=L.cls;if(d.textContent!==L.text)d.textContent=L.text;
    d.style.transform=`translate(${sx}px,${sy}px) translate(-50%,calc(-100% - ${L.cls.includes('mini')?6:12}px))`;});
}

function resize(){const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix();}
new ResizeObserver(resize).observe(stage);resize();
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const _v=new THREE.Vector3();
function tick(now){
  if(fly){const t=Math.min(1,(now-fly.t0)/650),k=ease(t);controls.target.lerpVectors(fly.fromT,fly.toT,k);cam.position.lerpVectors(fly.fromP,fly.toP,k);if(t>=1)fly=null;}
  controls.update();
  const pulse=1+0.35*Math.sin(now/180);
  for(const k in pins){const p=pins[k];if(!p.visible)continue;const {id,pid}=p.userData;
    const sel=(S.sel&&S.sel.kind==='mark'&&S.sel.id===id&&S.sel.pid===pid)||S.tab==='quiz';
    const dist=cam.position.distanceTo(p.position);const base=Math.max(.28,Math.min(1.6,dist/3.2));
    p.scale.setScalar(base*(sel?(S.tab==='quiz'&&!S.quiz.answered?pulse*1.5:1.6):1));
    _v.copy(cam.position).sub(p.position);const facing=_v.dot(p.userData.n)>-0.3*_v.length();p.userData.facing=facing;
    p.material.opacity=(facing||sel?1:0.28)*(S.sel&&S.sel.kind==='mark'&&!sel?.6:1);
    if(S.tab==='quiz')p.material.color.set(S.quiz.answered?(S.quiz.correct?COL.good:COL.bad):COL.accent);
    else p.material.color.set(sel?COL.ink:COL[MD[id].t]);}
  renderer.render(scene,cam);updateLabels();requestAnimationFrame(tick);}

const ray=new THREE.Raycaster(),ndc=new THREE.Vector2();let down=null;
renderer.domElement.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY,t:performance.now()};dismissCoach();});
renderer.domElement.addEventListener('pointerup',e=>{if(!down)return;const moved=Math.hypot(e.clientX-down.x,e.clientY-down.y),dt=performance.now()-down.t;down=null;
  if(moved>7||dt>500||S.tab==='quiz')return;
  const r=renderer.domElement.getBoundingClientRect();ndc.set(((e.clientX-r.left)/r.width)*2-1,-((e.clientY-r.top)/r.height)*2+1);ray.setFromCamera(ndc,cam);
  const ph=ray.intersectObjects(Object.values(pins).filter(p=>p.visible).map(p=>p.children[0]),false);
  if(ph.length){const {id,pid}=ph[0].object.userData;selectMark(id,pid);return;}
  const hits=ray.intersectObjects(Object.values(meshes).filter(m=>m.visible),false);
  const hit=hits.find(h=>h.object.material!==boneGhost);
  if(!hit){if(S.sel||S.iso){S.sel=null;S.iso=null;applyScene();render();}return;}
  const p=PBY[hit.object.userData.pid];
  if(p.k==='muscle'){p.mk?selectMus(p.mk,p.sd):selectPart(p.id);return;}
  if(S.iso===p.id){S.sel=null;applyScene();render();}else isolate(p.id);
});

const musLink=(k,s,role)=>`<button class="link" data-mus="${k}" data-side="${s}"><span class="dot t-mus"></span>${esc(MUS[k].n)}${role?` <span class="muted">· ${role}</span>`:''}</button>`;
const partLink=p=>`<button class="link" data-part="${p.id}">${p.k==='bone'?'':'<span class="dot t-mus"></span>'}${esc(p.nm)}</button>`;
const noteBlock=k=>`<div class="field"><h3>My note / mnemonic</h3><textarea id="note-${esc(k).replace(/[^a-zA-Z0-9-]/g,'_')}" data-note="${esc(k)}" placeholder="e.g. SIT on the greater tubercle">${esc(store.notes[k]||'')}</textarea></div>`;
const bmBtn=k=>`<button class="btn ghost" data-bm="${esc(k)}" aria-pressed="${isBm(k)}"><span class="star">${isBm(k)?'★':'☆'}</span> ${isBm(k)?'In Exam prep':'Save to Exam prep'}</button>`;
const credit=`<p class="credit">3D anatomy: <a href="https://dbarchive.biosciencedbc.jp/en/bodyparts3d/download.html" target="_blank" rel="noopener">BodyParts3D</a> © The Database Center for Life Science, CC BY 4.0, smoothed, simplified and recolored for this atlas. Marking pins are placed automatically and are approximate.</p>`;

function renderExplore(){const sel=S.sel;
  if(sel&&sel.kind==='mark'){const m=MD[sel.id],bp=PBY[sel.pid];
    return `<div class="meta"><span class="pill">${dot(m.t)}${TYPE[m.t]}</span><button class="pill" data-part="${bp.id}">${esc(bp.nm)}</button></div>
    <h2>${esc(m.n)}</h2><p>${esc(m.d)}</p>
    ${m.attach.length?`<div class="field"><h3>Muscle attachments</h3><div class="links">${m.attach.map(a=>musLink(a.m,bp.sd||'R',a.r)).join('')}</div></div>`:''}
    ${m.at?`<div class="field"><h3>Muscle attachments</h3><p>${esc(m.at)}</p></div>`:''}
    ${m.lig?`<div class="field"><h3>Ligaments &amp; joints</h3><p>${esc(m.lig)}</p></div>`:''}
    ${m.c?`<div class="field"><h3>Clinical relevance</h3><p>${esc(m.c)}</p></div>`:''}
    <div class="row">${bmBtn('mark:'+sel.pid+'|'+m.id)}</div>${noteBlock('mark:'+m.id)}`;}
  if(sel&&sel.kind==='mus'){const m=MUS[sel.key],s=sel.s,other=s==='R'?'L':'R';
    return `<div class="meta"><span class="pill"><span class="dot t-mus"></span>Muscle</span><span class="pill">${SIDE[s]} side</span><button class="pill" data-mus="${sel.key}" data-side="${other}">Show ${SIDE[other].toLowerCase()}</button></div>
    <h2>${esc(m.n)}</h2>
    <div class="field"><h3>Action</h3><p>${esc(m.a)}</p></div>
    <div class="field"><h3>Origin</h3><p>${esc(m.oText)}</p>${m.o.length?`<div class="links" style="margin-top:8px">${m.o.map(k=>mLink(k,armPid(k,s))).join('')}</div>`:''}</div>
    <div class="field"><h3>Insertion</h3><p>${esc(m.iText)}</p>${m.i.length?`<div class="links" style="margin-top:8px">${m.i.map(k=>mLink(k,armPid(k,s))).join('')}</div>`:''}</div>
    <div class="field"><h3>Innervation</h3><p>${esc(m.inn)}</p></div>
    <div class="field"><h3>Blood supply</h3><p>${esc(m.bl)}</p></div>
    <div class="row">${bmBtn('mus:'+sel.key)}</div>${noteBlock('mus:'+sel.key)}`;}
  if(sel&&sel.kind==='part'){const p=PBY[sel.pid];
    return `<div class="meta"><span class="pill"><span class="dot t-mus"></span>Muscle</span><button class="pill" data-region="${p.rg}" data-go="region">${REGION[p.rg]}</button></div>
    <h2>${esc(p.nm)}</h2>
    <p class="muted">A full card (action, origin, insertion, nerve, blood supply) isn't written for this muscle yet. Cards exist for 14 shoulder and arm muscles so far.</p>
    <div class="row">${bmBtn('part:'+p.id)}</div>${noteBlock('part:'+p.id)}`;}
  if(S.iso){const p=PBY[S.iso];
    if(PM[p.id]){const bk=AM.BK[p.id]||'';let blurb='',latin='';
      if(bk.startsWith('arm:')){const b=BONES[bk.slice(4)];blurb=b.blurb;latin=b.latin;}else if(AM.BL[bk])blurb=AM.BL[bk][1];
      const ids=[...new Set(PM[p.id].map(x=>x.id))];
      const grp=t=>{const l=ids.filter(k=>MD[k].t===t);return l.length?`<div class="field"><h3>${TYPE[t]} · ${l.length}</h3><div class="links">${l.map(k=>mLink(k,p.id)).join('')}</div></div>`:'';};
      return `<div class="meta"><span class="pill">Bone</span>${latin?`<span class="pill latin">${latin}</span>`:''}${p.sd?`<span class="pill">${SIDE[p.sd]} side</span>`:''}<button class="pill" data-region="${p.rg}" data-go="region">${REGION[p.rg]}</button></div>
      <h2>${esc(p.nm)}</h2>${blurb?`<p>${esc(blurb)}</p>`:''}${grp('proj')}${grp('dep')}${grp('other')}
      <div class="row">${bmBtn('part:'+p.id)}</div>${noteBlock('part:'+p.id)}
      <p class="muted">Tip: turn on Labels to name every pin, then use Post and Med to check the back and inner side.</p>`;}
    return `<div class="meta"><span class="pill">Bone</span><button class="pill" data-region="${p.rg}" data-go="region">${REGION[p.rg]}</button></div>
      <h2>${esc(p.nm)}</h2>
      <p class="muted">This piece has no marking pins (teeth, cartilages and discs are left plain).</p>
      <div class="row">${bmBtn('part:'+p.id)}</div>${noteBlock('part:'+p.id)}`;}
  if(S.region!=='all'){const r=S.region;
    const bones=PARTS.filter(p=>p.k==='bone'&&p.rg===r&&!/tooth/i.test(p.nm)).sort((a,b)=>a.base.localeCompare(b.base)||a.nm.localeCompare(b.nm));
    const nm=PARTS.filter(p=>p.k==='muscle'&&p.rg===r).length;
    const cards=r==='upper'?`<div class="field"><h3>Muscle cards · 14</h3><div class="links">${Object.keys(MUS).map(k=>musLink(k,'R')).join('')}</div></div>`:'';
    return `<h2>${REGION[r]}</h2><p>${bones.length} bones and ${nm} muscles. Tap a bone on the model or below to isolate it.${S.muscles?'':' Turn on Muscles to add the muscle layer.'}</p>
      ${cards}<div class="field"><h3>Bones · ${bones.length}</h3><div class="links">${bones.map(partLink).join('')}</div></div>`;}
  const counts=r=>[PARTS.filter(p=>p.k==='bone'&&p.rg===r).length,PARTS.filter(p=>p.k==='muscle'&&p.rg===r).length];
  return `<h2>The whole body, <em>bone by bone</em></h2>
    <p>Pick a region, or tap any bone to isolate it and show its marking pins. Tap a pin for its definition, attachments and clinical notes. Tap empty space to bring the whole skeleton back.</p>
    <div class="field"><h3>Regions</h3><div class="grid2">${RORDER.slice(1).map(r=>{const [b,m]=counts(r);return `<button class="item" data-region="${r}" data-go="region"><span class="grow">${REGION[r]}<span class="note">${b} bones · ${m} muscles</span></span></button>`;}).join('')}</div></div>
    <div class="meta"><span class="pill">${dot('proj')}Projection</span><span class="pill">${dot('dep')}Depression / opening</span><span class="pill">${dot('other')}Neck, border, line</span></div>
    <div class="field"><h3>Muscle transparency</h3><label class="toggle" for="mop"><span class="muted">See bones through muscle</span></label><input id="mop" type="range" min="0.15" max="0.95" step="0.05" value="${S.muscleOpacity}" aria-label="Muscle opacity"></div>
    ${credit}`;}

/* ---------------- QUIZ ---------------- */
const keyOf=c=>c.kind==='mark'?'mark:'+c.pid+'|'+c.id:'part:'+c.id;
const fromKey=k=>{const [t,r]=[k.slice(0,k.indexOf(':')),k.slice(k.indexOf(':')+1)];
  if(t==='mark'){const [a,b]=r.split('|');if(PBY[a]&&instOf(a,b))return {kind:'mark',pid:a,id:b};if(M[a]&&b){const pid=armPid(a,b);return instOf(pid,a)?{kind:'mark',pid,id:a}:null;}return null;}if(t==='part')return PBY[r]?{kind:'part',id:r}:null;return null;};
function nameOf(c){return c.kind==='mark'?MD[c.id].n:PBY[c.id].nm;}
function quizPool(){const sc=S.quiz.scope,pool=S.quiz.pool;
  const inR=p=>sc==='all'||p.rg===sc;
  const marks=Object.keys(PM).filter(pid=>inR(PBY[pid])).flatMap(pid=>PM[pid].map(it=>({kind:'mark',pid,id:it.id})));
  const bones=PARTS.filter(p=>p.k==='bone'&&inR(p)&&!/tooth|cartilage/i.test(p.nm)).map(p=>({kind:'part',id:p.id}));
  const mus=musReady?PARTS.filter(p=>p.k==='muscle'&&inR(p)).map(p=>({kind:'part',id:p.id})):[];
  if(pool==='markings')return marks;if(pool==='bones')return bones;if(pool==='muscles')return mus;
  if(pool==='missed')return Object.keys(store.missed).map(fromKey).filter(c=>c&&(c.kind==='mark'||meshes[c.id]));
  return [...marks,...bones,...mus];}
function nextQ(){const Q=S.quiz;Q.answered=false;Q.picked=null;Q.guess='';
  if(Q.pool==='muscles'&&!musReady){Q.cur=null;render();ensureMuscles().then(()=>{if(S.tab==='quiz')nextQ();});return;}
  const pool=quizPool();if(!pool.length){Q.cur=null;applyScene();render();renderChips();return;}
  let c;do{c=pool[Math.floor(Math.random()*pool.length)];}while(pool.length>1&&Q.cur&&keyOf(c)===keyOf(Q.cur));Q.cur=c;
  let cand;
  if(c.kind==='mark'){const seen=new Set([norm(MD[c.id].n)]);const uniq=l=>l.filter(x=>{const k=norm(MD[x.id].n);if(seen.has(k))return false;seen.add(k);return true;});
    cand=uniq(PM[c.pid].filter(x=>x.id!==c.id).map(x=>({kind:'mark',pid:c.pid,id:x.id})));
    if(cand.length<3){const rg=PBY[c.pid].rg;cand=cand.concat(uniq(Object.keys(PM).filter(p=>PBY[p].rg===rg&&p!==c.pid).flatMap(p=>PM[p].map(x=>({kind:'mark',pid:p,id:x.id}))).sort(()=>Math.random()-.5)));}}
  else{const p=PBY[c.id];const seen=new Set([norm(p.nm)]);
    cand=PARTS.filter(x=>x.k===p.k&&x.rg===p.rg&&meshes[x.id]&&x.id!==p.id).filter(x=>{const k=norm(x.nm);if(seen.has(k))return false;seen.add(k);return true;}).map(x=>({kind:'part',id:x.id}));}
  cand.sort(()=>Math.random()-.5);Q.choices=[c,...cand.slice(0,3)].sort(()=>Math.random()-.5);
  applyScene();render();renderChips();
  if(c.kind==='mark'){const it=instOf(c.pid,c.id);const sz=boxOfIds([c.pid]).getSize(new THREE.Vector3()).length();flyTo(it.pos,Math.max(1.0,Math.min(3.0,sz*1.6)),pickDir(it,c.pid));}
  else{const ctr=partCenter([c.id]);const bx=boxOfIds([c.id]);bx.expandByScalar(Math.max(0.35,bx.getSize(new THREE.Vector3()).length()*0.35));frame(bx,ctr.z<-0.35?[0.15,0.1,-1]:[0.15,0.1,1]);}}
function pickDir(it,pid){const ctr=partCenter([pid]);const off=it.pos.clone().sub(ctr).normalize();const n=it.n;
  return [n.x*0.8+off.x*0.4,0.15+n.y*0.3,n.z*0.8+off.z*0.4+0.05];}
function answer(k){const Q=S.quiz;if(Q.answered)return;Q.answered=true;Q.picked=k;Q.correct=k===keyOf(Q.cur);finishAnswer();}
function answerTyped(text){const Q=S.quiz;if(Q.answered)return;const g=norm(text);if(!g)return;Q.guess=text;const c=Q.cur;
  const keys=c.kind==='mark'?[MD[c.id].n,...(MD[c.id].aka||[])]:[PBY[c.id].nm,PBY[c.id].base];
  Q.correct=keys.some(k=>norm(k)===g);Q.answered=true;finishAnswer();}
function finishAnswer(){const Q=S.quiz,k=keyOf(Q.cur);Q.total++;
  if(Q.correct){Q.right++;Q.streak++;if(store.missed[k]){store.missed[k]--;if(store.missed[k]<=0)delete store.missed[k];}}
  else{Q.streak=0;store.missed[k]=(store.missed[k]||0)+1;}
  save();render();}
function renderQuiz(){const Q=S.quiz;
  const pools=[['markings','Bone markings','Dots on every bone'],['bones','Bones','Name the whole bone'],['muscles','Muscles','Needs the muscle layer'],['mixed','Mixed','All of the above'],['missed',`Missed (${Object.keys(store.missed).length})`,'Drill your mistakes']];
  const score=`<div class="score"><div><b>${Q.right}/${Q.total}</b>score</div><div><b>${Q.streak}</b>streak</div><div><b>${Q.total?Math.round(Q.right/Q.total*100):0}%</b>accuracy</div></div>
   <div class="qprog" aria-hidden="true"><i style="width:${Q.total?Math.round(Q.right/Q.total*100):0}%"></i></div>`;
  const settings=`<div class="field"><h3>Test mode</h3><div class="modes">${pools.map(([k,n,sub])=>`<button class="mode" data-pool="${k}" aria-pressed="${Q.pool===k}"><b>${n}</b><small>${sub}</small></button>`).join('')}</div></div>
   <div class="row"><button class="btn ghost" data-typed aria-pressed="${Q.typed}">${Q.typed?'Typing answers':'Multiple choice'}</button><span class="muted" style="font-size:13px">${Q.typed?'Spelling counts, like a lab practical. Side is optional for bones and muscles.':'Switch to typing for practical-exam mode.'}</span></div>
   <p class="muted" style="font-size:13px">Use the region chips at the top to test one part of the body.</p>`;const head='';
  if(!Q.cur){let msg='No structures in this scope.';
    if(Q.pool==='missed')msg='Nothing missed yet. Questions you get wrong land here so you can drill them.';
    else if(Q.pool==='muscles'&&!musReady)msg='Loading muscles…';
    return score+`<div class="empty">${msg}</div>`+settings;}
  const c=Q.cur;const prompt=c.kind==='mark'?`Name the highlighted marking on the ${PBY[c.pid].nm.toLowerCase().replace(/^(right|left) /,(m)=>m)}.`:`Name the highlighted ${PBY[c.id].k}.`;
  let ans='';
  if(Q.typed)ans=Q.answered?'':`<form class="typed" id="typedForm"><input id="guess" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Type the structure name" aria-label="Your answer"><button class="btn" type="submit">Check</button></form>`;
  else ans=`<div class="choices">${Q.choices.map(x=>{const k=keyOf(x);let cls='choice';if(Q.answered){if(k===keyOf(c))cls+=' right';else if(k===Q.picked)cls+=' wrong';}
    return `<button class="${cls}" data-answer="${esc(k)}" ${Q.answered?'disabled':''}>${esc(nameOf(x))}<kbd>${Q.choices.indexOf(x)+1}</kbd></button>`;}).join('')}</div>`;
  let after='';
  if(Q.answered){const info=c.kind==='mark'?MD[c.id].d:(PBY[c.id].mk?MUS[PBY[c.id].mk].a:'');
    const bk=keyOf(c);
    after=`<p class="verdict ${Q.correct?'ok':'no'}">${Q.correct?'Correct':'Not quite'}: ${esc(nameOf(c))}</p>
    ${Q.typed&&!Q.correct?`<p class="muted">You wrote "${esc(Q.guess)}".</p>`:''}${info?`<p>${esc(info)}</p>`:''}
    <div class="row"><button class="btn" data-next>Next structure</button><button class="btn ghost" data-learn="${esc(keyOf(c))}">Open card</button>${bmBtn(bk)}</div>`;}
  return `<div><h3>Question ${Q.total+(Q.answered?0:1)}</h3><p style="font-size:17px">${prompt}</p></div>${ans}${after}`+score+settings;}

/* ---------------- EXAM PREP ---------------- */
function prepRow(k,extra){const [t,id]=[k.slice(0,k.indexOf(':')),k.slice(k.indexOf(':')+1)];let n,sub,attr,dt;
  if(t==='mark'){const c=fromKey(k);let mid,pid;if(c){mid=c.id;pid=c.pid;}else if(MD[id]&&firstPid(id)){mid=id;pid=firstPid(id);}else return '';
    n=MD[mid].n;sub=PBY[pid].nm.toLowerCase();attr=`data-mark="${mid}" data-pid="${pid}"`;dt=dot(MD[mid].t);}
  else if(t==='mus'){if(!MUS[id])return '';n=MUS[id].n;sub='Muscle card';attr=`data-mus="${id}" data-side="R"`;dt='<span class="dot t-mus" style="display:inline-block"></span>';}
  else{const p=PBY[id];if(!p)return '';n=p.nm;sub=(p.k==='bone'?'Bone':'Muscle')+' · '+REGION[p.rg];attr=`data-part="${id}"`;dt=p.k==='bone'?'':'<span class="dot t-mus" style="display:inline-block"></span>';}
  const note=store.notes[k]||(k.startsWith('mark:')?store.notes['mark:'+k.split('|').pop()]:'');
  return `<button class="item" ${attr}><span class="grow">${dt} ${esc(n)}${note?`<span class="note">${esc(note)}</span>`:''}</span><small>${esc(sub)}${extra||''}</small></button>`;}
function renderPrep(){const missed=Object.entries(store.missed).sort((a,b)=>b[1]-a[1]);
  const bm=store.bm.map(k=>prepRow(k)).filter(Boolean),ms=missed.map(([k,n])=>prepRow(k,` · ${n}×`)).filter(Boolean);
  return `<h2>Exam prep</h2><p class="muted">Saved structures and your notes stay on this device.</p>
  <div class="field"><h3>Saved · ${bm.length}</h3>${bm.length?`<div class="list">${bm.join('')}</div>`:`<div class="empty">Tap "Save to Exam prep" on any bone, marking or muscle. Add a mnemonic in its note so it shows up here.</div>`}</div>
  <div class="field"><h3>Missed in pin tests · ${ms.length}</h3>${ms.length?`<div class="list">${ms.join('')}</div><div class="row" style="margin-top:10px"><button class="btn" data-drill>Drill missed</button></div>`:`<div class="empty">Structures you miss in the pin test collect here automatically.</div>`}</div>`;}

let lastView='';
function viewKey(){const q=S.quiz;return [S.tab,S.region,S.iso,S.sel&&JSON.stringify(S.sel),S.tab==='quiz'?(q.cur&&keyOf(q.cur))+q.answered+q.pool:''].join('/');}
function render(){const vk=viewKey();const keepScroll=vk===lastView?body.scrollTop:0;
  body.innerHTML=S.tab==='explore'?renderExplore():S.tab==='quiz'?renderQuiz():renderPrep();renderChips();updateCrumb();moveTabInd();
  if(vk!==lastView){body.classList.remove('enter');void body.offsetWidth;body.classList.add('enter');body.scrollTop=0;}else body.scrollTop=keepScroll;lastView=vk;
  const f=document.getElementById('typedForm');if(f)f.addEventListener('submit',e=>{e.preventDefault();answerTyped(document.getElementById('guess').value);});
  const op=document.getElementById('mop');if(op)op.addEventListener('input',()=>{S.muscleOpacity=+op.value;if(!S.muscles){S.muscles=true;tMus.setAttribute('aria-pressed','true');ensureMuscles();}applyScene();});}

body.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;const d=t.dataset;
  if(d.mark){selectMark(d.mark,d.pid);body.scrollTop=0;}
  else if(d.mus){selectMus(d.mus,d.side||'R');body.scrollTop=0;}
  else if(d.part){selectPart(d.part);body.scrollTop=0;}
  else if(d.go==='region'){toExplore();setRegion(d.region);}
  else if(d.bm){const i=store.bm.indexOf(d.bm);i>=0?store.bm.splice(i,1):store.bm.push(d.bm);save();render();toast(i>=0?'Removed from Exam prep':'Saved to Exam prep');}
  else if(d.pool){S.quiz.pool=d.pool;S.quiz.cur=null;nextQ();}
  else if('typed' in d){S.quiz.typed=!S.quiz.typed;render();}
  else if(d.answer){answer(d.answer);}
  else if('next' in d){nextQ();setTimeout(()=>{const g=document.getElementById('guess');g&&g.focus();},50);}
  else if(d.learn){const c=fromKey(d.learn);if(!c)return;if(c.kind==='mark')selectMark(c.id,c.pid);else{const p=PBY[c.id];p.mk?selectMus(p.mk,p.sd):selectPart(c.id);}}
  else if('drill' in d){S.quiz.pool='missed';S.quiz.cur=null;setTab('quiz');nextQ();}
});
body.addEventListener('input',e=>{const k=e.target.dataset&&e.target.dataset.note;if(!k)return;const v=e.target.value;if(v.trim())store.notes[k]=v;else delete store.notes[k];save();});

/* ---------------- BOOT ---------------- */
applyScene();render();
cam.position.set(0,0,30);controls.target.set(0,-1,0);
requestAnimationFrame(tick);
showLoad('Loading skeleton…');
fetchPack('bone.txt').then(buf=>{buildFile(buf,'bone');hideLoad();applyScene();resize();frameRegion('all',DIRS.ant);showCoach();})
  .catch(e=>{showLoad(e&&e.message==='old'?'This browser is too old to open the 3D models. Update it and reload.':'The 3D models could not load. Reload the page to try again.');});

</script>
</body>
